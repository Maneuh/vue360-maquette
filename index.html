<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vue Client 360° Ticketing</title>
<style>
/* Base VUE 360 : barre latérale noire, contenu clair, accent orange. Un seul thème clair assumé (outil métier interne). */
:root{
  color-scheme: light;
  --orange:#FF7900; --orange-d:#D96600; --orange-l:#FFF1E5; --orange-ll:#FFF8F2;
  --ink:#141414; --ink-2:#3A3A3A; --muted:#75716B; --faint:#A8A39B;
  --bg:#F4F3F1; --card:#FFFFFF; --line:#E6E3DE; --line-2:#F0EEEA; --side:#000000; --side-ink:#D9D6D1;
  --ok:#1F8A4C; --ok-bg:#E7F5EC; --mid:#B88A00; --mid-bg:#FFF6D6; --warn:#E06A00; --warn-bg:#FFEBD6;
  --late:#C9372C; --late-bg:#FDE8E6; --info:#1B5FA8; --info-bg:#E6EFFA; --om:#B35900; --gsm:#1B5FA8;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-s:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--orange-d);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 0 232px,transparent 232px)}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:22px 14px 18px;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px;color:#fff;font-weight:800;line-height:1.15;font-size:15px}
.brand img{width:46px;height:46px;display:block}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);font-weight:600;font-size:14px;text-decoration:none}
.nav a:hover{background:#1c1c1c;color:#fff}
.nav a.on{background:var(--orange-l);color:var(--orange-d)}
.nav a .cnt{margin-left:auto;background:var(--orange);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.nav a.on .cnt{background:var(--orange-d)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;border-top:1px solid #222;padding-top:14px}
.side-foot a{display:flex;align-items:center;gap:10px;color:var(--side-ink);padding:8px 8px;border-radius:8px;text-decoration:none;font-weight:600}
.side-foot a:hover{background:#1c1c1c;color:#fff}
.av{width:32px;height:32px;border-radius:50%;background:#3a3a3a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.av.or{background:var(--orange)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top form{display:flex;gap:8px;flex:1;max-width:620px;min-width:0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px}
.search input{border:0;background:transparent;outline:0;padding:9px 0;width:100%;min-width:0}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px}
.whobtn{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:10px;text-align:left;color:var(--ink)}
.whobtn:hover{background:var(--bg)}
.whobtn .txt{display:flex;flex-direction:column}
.who .nm{font-weight:700;font-size:13px;line-height:1.2}
.who .fn{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{border-color:var(--faint)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--late);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 6px}
.burger{display:none}
.content{padding:22px 28px 110px;display:flex;flex-direction:column;gap:18px;min-width:0}

/* Generic */
.crumb{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--muted)}
.crumb b{color:var(--orange-d);font-weight:600}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.ph p{margin:3px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3{font-size:13px;font-weight:800}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.f{display:flex;flex-direction:column;gap:2px}
.f .k{font-size:11.5px;color:var(--muted)}
.f .v{font-weight:700;font-size:13.5px}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid transparent;background:var(--card);white-space:nowrap;text-decoration:none!important}
.btn.p{background:var(--orange);color:#fff}
.btn.p:hover{background:var(--orange-d)}
.btn.s{border-color:var(--line);color:var(--ink)}
.btn.s:hover{border-color:var(--faint)}
.btn.ok{background:var(--card);border-color:var(--ok);color:var(--ok)}
.btn.ok:hover{background:var(--ok-bg)}
.btn.dk{background:var(--ink);color:#fff}
.btn.danger{border-color:var(--late);color:var(--late);background:var(--card)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--orange-d);font-weight:700;cursor:pointer;font-size:13px}
.link:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.n::before{display:none}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-mid{background:var(--mid-bg);color:var(--mid)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-late{background:var(--late-bg);color:var(--late)}
.t-info{background:var(--info-bg);color:var(--info)}
.t-or{background:var(--orange-l);color:var(--orange-d)}
.t-grey{background:#EFEDEA;color:#5b5750}
.t-dark{background:var(--ink);color:#fff}
.tag{display:inline-block;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700;background:#EFEDEA;color:#4a4640}
.tag.or{background:var(--orange);color:#fff}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;background:#FAF9F7;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
td:first-child{white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--orange-ll)}
tr.red td:first-child{box-shadow:inset 3px 0 0 var(--late)}
tr.amber td:first-child{box-shadow:inset 3px 0 0 var(--warn)}

.bar{height:7px;border-radius:5px;background:#ECEAE6;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:5px}
.slacell{display:flex;align-items:center;gap:8px;min-width:150px}
.slacell span{font-size:11.5px;font-weight:700;white-space:nowrap}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:11px 2px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:13.5px}
.tabs button.on{color:var(--orange-d);border-color:var(--orange)}
.tabs button .cnt{display:inline-block;margin-left:6px;background:#EFEDEA;color:var(--ink-2);border-radius:999px;font-size:11px;padding:0 7px}
.seg{display:inline-flex;background:#EFEDEA;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:6px 11px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Forms */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fld label .req{color:var(--late)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#FCFBFA;min-width:0}
.inp:focus{outline:2px solid var(--orange-l);border-color:var(--orange)}
.inp[readonly]{background:#F3F2EF;color:var(--ink-2)}
.inp.err{border-color:var(--late);background:var(--late-bg)}
textarea.inp{min-height:76px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.errtxt{font-size:12px;color:var(--late);font-weight:600}
.qlist{display:flex;flex-direction:column}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.q:last-child{border-bottom:0}
.qt{font-size:13px}
.qb{display:inline-flex;gap:4px}
.qb button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.qb button[disabled]{cursor:default}
.qb button.on.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.qb button.on.ko{background:var(--late-bg);border-color:var(--late);color:var(--late)}
.q .qn,.q .qnote{grid-column:1/-1}
.qnote{font-size:12.5px;color:var(--late);font-weight:600}
.recall{background:#FBFAF8;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:4px 0 8px}
.rh{font-weight:800;font-size:12.5px;margin-bottom:6px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 0;cursor:pointer;font-size:13.5px}
.chk input{margin-top:3px;accent-color:var(--orange)}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer}
.choice button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.choice button[disabled]{opacity:.4;cursor:not-allowed}

/* Notice boxes */
.note{border-radius:10px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.sys{background:var(--ok-bg);color:#14532d}
.note.warn{background:var(--warn-bg);color:#7a3b00}
.note.late{background:var(--late-bg);color:#7f1d1d}
.note.info{background:var(--info-bg);color:#123e6e}
.note.grey{background:#F1EFEB;color:var(--ink-2)}
.note b{font-weight:800}

/* Client */
.client-h{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.client-h .idn{display:flex;gap:14px;align-items:center;min-width:240px}
.mono-av{width:56px;height:56px;border-radius:10px;background:#EEECE8;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.circle-av{width:58px;height:58px;border-radius:50%;background:var(--orange-l);color:var(--orange-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;flex-shrink:0}
.client-h .ids{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:12px 18px;flex:1 1 420px;min-width:0}
.lines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.line{border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:4px}
.line.on{border-color:var(--orange);background:var(--orange-ll)}
.line .ms{font-weight:800;font-size:15px}
.alerts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--late-bg);border:1px solid #F5C9C4;border-radius:10px;padding:10px 12px}
.alerts .h{font-weight:800;color:var(--late);font-size:12px}
.alerts span.a{background:var(--card);border:1px solid #F5C9C4;color:var(--late);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.alerts span.a.soft{border-color:#F6D9B8;color:var(--warn)}
.svc{display:flex;flex-direction:column;gap:6px}
.svc .hd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.svc .ttl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px}
.svc .ttl svg{color:var(--orange);width:20px;height:20px}
.donut{width:118px;height:118px;border-radius:50%;position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--card)}
.donut b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:20px}
.donut b small{font-size:10.5px;color:var(--muted);font-weight:600}

/* Ticket */
.t-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.t-head .code{color:var(--orange-d);font-weight:800;font-size:12.5px}
.t-head h1{font-size:23px;font-weight:800;margin:3px 0}
.sla-big .bar{height:9px}
.marks{position:relative;height:16px;font-size:10.5px;color:var(--muted);margin-top:4px}
.marks>span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.marks>span:first-child{transform:none}
.marks>span:last-child{transform:translateX(-100%)}
.ticks{position:relative}
.ticks::before,.ticks::after{content:"";position:absolute;top:-3px;width:1px;height:15px;background:#BDB8B0}
.ticks::before{left:50%}
.ticks::after{left:80%}
.chain{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 2px 8px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:112px;text-align:center}
.step .c{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid #DAD6CF;background:#F7F6F4;color:var(--muted)}
.step.done .c{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.step.cur .c{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 5px var(--orange-l)}
.step.cur.late .c{background:var(--late);border-color:var(--late);box-shadow:0 0 0 5px var(--late-bg)}
.step.closed .c{background:var(--ink);border-color:var(--ink);color:#fff}
.step .t{font-weight:700;font-size:12.5px}
.step .s{font-size:11px;color:var(--muted)}
.link-l{flex:1;min-width:26px;height:2px;background:#DAD6CF;margin-top:23px}
.chain.compact .step{min-width:76px}
.chain.compact .link-l{min-width:10px}
.chain.compact .step .c{width:40px;height:40px}
.chain.compact .link-l{margin-top:20px}
.link-l.done{background:var(--ok)}
.task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2)}
.task:last-child{border-bottom:0}
.task .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #CFCAC2;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;cursor:pointer;background:var(--card)}
.task .ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.task .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.task .tl{font-size:13.5px;font-weight:600}
.task .tl small{font-weight:600;color:var(--muted)}
.sysbox{border:1px solid var(--line);border-radius:9px;background:#FBFAF8;padding:10px 12px;font-size:12.5px}
.sysbox .sh{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.sysbox .kv{font-size:12.5px;grid-template-columns:minmax(110px,auto) 1fr}
.task .ck.ro{cursor:default}
.btn.o{background:var(--card);border-color:var(--orange);color:var(--orange-d)}
.btn.o:hover{background:var(--orange-ll)}
.btn.red{background:var(--late);color:#fff}
.btn.red:hover{background:#A82C22}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Historique des transactions Orange Money */
.txbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
table.txt th{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--muted);background:#F7F6F4}
table.txt td{font-size:13px;padding:10px 8px}
table.txt th{padding:10px 8px}
table.txt th:first-child,table.txt td:first-child{padding-left:12px}
.txwrap{padding:4px 0 12px;border-bottom:1px solid var(--line-2)}
table.txt td.num,table.txt td.mono{white-space:nowrap}
table.txt tr.txr.open td{background:var(--orange-ll);border-bottom-color:transparent}
table.txt tr.txr.ret td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
.txd{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border:1px solid transparent;background:var(--orange-l);color:var(--orange-d);font-weight:700;font-size:12.5px;border-radius:7px;padding:6px 10px;cursor:pointer}
.txd:hover{border-color:var(--orange)}
.txd.on{background:var(--card);border-color:var(--orange)}
tr.txdet td{padding:0 10px 12px;background:var(--orange-ll)}
.txp{border:1.5px dashed var(--orange);border-radius:6px;background:var(--card);padding:14px 16px;white-space:normal}
.txp-h{font-weight:800;font-size:14.5px;margin-bottom:12px}
.txp-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.txp-g .k{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.txp-g .v{display:block;font-weight:700;font-size:13px}
.txp-f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.txp-f .t{font-weight:800;font-size:13px;margin-bottom:4px}
.txp-f .q{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.txp-f .note{margin-top:8px}
@media (max-width:1100px){.txp-g{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:720px){.txp-g{grid-template-columns:repeat(2,minmax(0,1fr))}.txp-f{grid-template-columns:minmax(0,1fr)}}
.decide{border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;display:flex;flex-direction:column;gap:12px}
.decide .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--card);text-align:left;display:flex;flex-direction:column;gap:3px}
.opt:hover{border-color:var(--faint)}
.opt.on{border-color:var(--orange);background:var(--orange-ll)}
.opt.close.on{border-color:var(--ok);background:var(--ok-bg)}
.opt.ret.on{border-color:var(--info);background:var(--info-bg)}
.opt b{font-size:13.5px}
.opt span{font-size:12px;color:var(--muted)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.tl-list{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl-i::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line-2)}
.tl-i:last-child::before{display:none}
.tl-i .d{width:12px;height:12px;border-radius:50%;background:var(--orange);margin-top:3px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--orange)}
.tl-i .d.sys{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.tl-i .d.red{background:var(--late);box-shadow:0 0 0 1px var(--late)}
.tl-i .d.blue{background:var(--info);box-shadow:0 0 0 1px var(--info)}
.tl-i .w{font-size:12.5px;font-weight:700}
.tl-i .w small{color:var(--muted);font-weight:600}
.tl-i .x{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.sms{border-left:3px solid var(--orange);background:#FBFAF8;padding:8px 10px;border-radius:0 8px 8px 0;font-size:12.5px}
.sms small{display:block;color:var(--muted);font-weight:600;margin-bottom:2px}
.banner{border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
.banner.red{background:var(--late);color:#fff}
.banner.amber{background:var(--warn-bg);color:#7a3b00;border:1px solid #F6CDA1}
.banner.dark{background:var(--ink);color:#fff}
.banner .btn{margin-left:auto}

/* Stats */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.stat:hover{border-color:var(--faint)}
.stat.on{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr)}
.login .l{background:var(--side);color:#fff;padding:36px 32px;display:flex;flex-direction:column;gap:28px}
.login .l p{color:#BDB8B0;margin:0;font-size:13.5px}
.login .r{padding:36px 40px 120px;display:flex;flex-direction:column;gap:22px;min-width:0}
.prof{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.prof button{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;gap:11px;align-items:center}
.prof button:hover{border-color:var(--orange);background:var(--orange-ll)}
.prof .t1{font-weight:800;font-size:13.5px}
.prof .t2{font-size:12px;color:var(--muted)}

/* Overlays */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;align-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.ok{background:#14532d}
.toast.err{background:#7f1d1d}
.modal-bg{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.modal{background:var(--card);border-radius:14px;width:min(760px,100%);padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mh h2{font-size:17px}
.drop{position:absolute;right:0;top:46px;width:min(380px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.15);padding:8px;z-index:40;max-height:70vh;overflow-y:auto}
.drop .it{display:block;padding:9px 10px;border-radius:8px;font-size:12.5px;color:var(--ink);cursor:pointer;border:0;background:none;text-align:left;width:100%}
.drop .it:hover{background:var(--orange-ll)}
.drop .it small{display:block;color:var(--muted)}
.demo{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;background:#1b1b1b;color:#eee;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:12px;max-width:calc(100% - 32px)}
.demo b{color:var(--orange)}
.demo button{white-space:nowrap;flex-shrink:0;background:#2c2c2c;color:#eee;border:1px solid #3a3a3a;border-radius:7px;padding:5px 9px;font-weight:700;font-size:11.5px;cursor:pointer}
.demo button:hover{background:#3a3a3a}
.demo .clk{font-variant-numeric:tabular-nums;color:#fff;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.scn{display:flex;flex-direction:column;gap:10px}
.scn ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.kbd{font-family:var(--mono);font-size:12px;background:#F1EFEB;border-radius:5px;padding:1px 6px}
.mt0{margin-top:0}

@media (max-width:1100px){
  .split{grid-template-columns:minmax(0,1fr)}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .client-h .ids{grid-template-columns:repeat(2,minmax(110px,1fr))}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);background:none}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .burger{display:inline-flex}
  .top{padding:10px 16px;flex-wrap:wrap}
  .top .who .txt{display:none}
  .content{padding:16px 16px 140px}
  .g2,.g3,.lines,.fgrid{grid-template-columns:minmax(0,1fr)}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .login{grid-template-columns:minmax(0,1fr)}
  .login .r{padding:22px 16px 120px}
  .login .l{padding:24px 16px}
}
@media (max-width:520px){
  .top form .btn{display:none}
  .marks>span:first-child,.hide-s{display:none}
  .demo{left:16px;right:16px;flex-wrap:nowrap;overflow-x:auto;padding:6px 8px}
  .demo .clk{white-space:nowrap}
  .g4,.g5{grid-template-columns:minmax(0,1fr)}
}

/* =========================================================
   Charte des maquettes Vue 360 (barre noire, univers client)
   ========================================================= */
body{background:#F4F4F4}
.side{padding:24px 10px 20px}
.brand{font-size:16px}
.brand img{width:56px;height:56px}
.nav{gap:6px}
.nav a{font-size:15.5px;font-weight:500;padding:11px 12px;color:#fff;gap:12px}
.nav a svg{width:22px;height:22px}
.nav a.on{background:#FFF1E5;color:var(--orange);font-weight:700}
.side-foot{border-top:0}
.side-foot a{color:#fff;font-weight:700;font-size:15px;gap:12px}
.av.gr{background:#E6E6E6;color:#333}
.av.lg{width:44px;height:44px;font-size:14px}
.top{background:#000;border-bottom:4px solid var(--orange);padding:12px 28px;gap:16px}
.top form{max-width:560px;gap:0;align-items:stretch}
.top form input{flex:1;min-width:0;border:0;background:#fff;padding:12px 14px;font-size:13px;outline:0}
.top form input:focus{box-shadow:inset 0 0 0 2px var(--orange)}
.btn.sq{background:var(--orange);color:#000;border-radius:0;padding:0 22px;font-weight:700;margin-left:22px}
.btn.sq:hover{background:var(--orange-d)}
.iconbtn.dk{background:transparent;border:0;color:#fff}
.iconbtn.dk:hover{background:#1c1c1c}
.top .who{gap:14px}
.whobtn{color:#fff}
.whobtn:hover{background:#1c1c1c}
.who .nm{font-size:15px;color:#fff}
.who .fn{color:#BDBDBD;font-size:12.5px;font-weight:600}
.top.home{min-height:76px}

/* Accueil */
.hero{background:#fff;margin:-22px -28px 0;padding:34px 28px 26px;display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:42px;font-weight:800;text-align:center;letter-spacing:-.01em}
.hsearch{display:flex;gap:18px;align-items:stretch}
.hs{flex:1;display:flex;align-items:center;gap:14px;border:2px solid #E3E3E3;border-radius:8px;background:#fff;padding:0 20px;color:#8A8A8A;min-width:0}
.hs input{border:0;outline:0;flex:1;min-width:0;padding:18px 0;font-size:14px;background:transparent;color:var(--ink)}
.hs.sm{border-width:1px;border-radius:7px;padding:0 10px;gap:8px}
.hs.sm input{padding:8px 0;font-size:12.5px;width:240px}
.hbtn{min-width:240px;font-size:15px;border-radius:8px;gap:12px}
.hhint{display:flex;justify-content:center;gap:24px;color:#6B6B6B;font-size:14.5px;flex-wrap:wrap;position:relative}
.hhint .kb{display:inline-flex;align-items:center;gap:10px;margin-left:auto}
.hres{display:flex;flex-direction:column;gap:8px;max-width:960px;width:100%;margin:0 auto}
.hband{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.hupd{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:14px;color:#444}
.hupd .upd{display:inline-flex;align-items:center;gap:8px}
.hcard{border:0;border-radius:8px;padding:20px 22px}
.hcard h2{font-size:20px;gap:14px;margin-bottom:16px}
.hcard h2 svg{color:var(--orange)}
.rlist{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto 20px;gap:14px;align-items:center;background:#F5F6F8;border:0;border-radius:6px;padding:18px 14px;text-align:left;cursor:pointer;color:var(--ink)}
.rrow:hover{background:#FFF1E5}
.rrow b{font-size:16px}
.rrow .sub{font-size:15px;color:#7A7A7A}
.rrow svg{color:#555}
.svcrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1.5px solid #DADADA;font-size:17px;color:#333;gap:10px}
.okdot{width:28px;height:28px;border-radius:50%;background:#D8F0E0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.okdot::after{content:"";width:13px;height:13px;border-radius:50%;background:#1F9D55}
.okdot.sm{width:12px;height:12px;background:none}
.okdot.sm::after{width:10px;height:10px}
button.pill.inc{border:0;cursor:pointer}

/* En-tête client */
.chead{margin:-22px -28px 0}
.idcard{background:#fff;border-bottom:1px solid #E6E6E6;padding:0 28px 14px}
.idtop{display:flex;gap:36px;align-items:center}
.idlab{background:#EBEBEB;padding:20px 30px;font-size:19px;font-weight:700;color:#222}
.idname{font-size:20px;font-weight:800}
.sq{display:inline-block;padding:5px 10px;font-size:12.5px;font-weight:700;background:#EBEBEB;color:#333}
.sq.or{background:var(--orange);color:#111}
.sq.red{background:var(--late-bg);color:var(--late)}
.idcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px}
.idc{display:flex;flex-direction:column;padding:6px 26px;border-left:1px solid #E3E3E3;min-width:0}
.idc:first-child{border-left:0;padding-left:16px}
.idc .k{font-size:16px;color:#6E6E6E}
.idc .v{font-size:16.5px;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}
.lcard{background:#fff;padding:16px 28px 18px;border-bottom:1px solid #E6E6E6}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lhead h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:6px}
.lhead .sub{font-size:14.5px;color:#555;margin-top:2px}
.lhead .btn{font-size:15px;padding:10px 22px;border-radius:8px;gap:12px}
.lcard .lines{grid-template-columns:repeat(3,minmax(0,330px));gap:30px;padding-left:min(9%,100px)}
.lcard .line{border:1px solid #E3E3E3;border-radius:4px;padding:16px 16px 14px;gap:6px}
.lcard .line.on{border:1.5px solid var(--orange);background:#FFF8F2}
.lcard .line .ms{font-size:16px}
.lsel{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:#222}
.cb{width:18px;height:18px;border-radius:4px;background:#E2E2E2;color:#333;display:inline-flex;align-items:center;justify-content:center}
.cb.on{background:#1A73E8;color:#fff}
.utabs{display:flex;gap:6px;justify-content:center;background:#F2F2F2;border-bottom:1.5px solid #8E8E8E;padding:0 28px;overflow-x:auto}
.utabs button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 26px 11px;font-weight:700;font-size:15px;color:#444;cursor:pointer;white-space:nowrap}
.utabs button.on{color:var(--orange);border-color:var(--orange)}
.utabs .cnt{display:inline-block;margin-left:6px;background:var(--orange);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.ubody{display:flex;flex-direction:column;gap:16px;min-width:0}
.uhead{display:flex;flex-direction:column;gap:2px}
.crumbk{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:#666;font-size:14px;cursor:pointer;padding:0;align-self:flex-start}
.crumbk:hover{color:var(--orange)}
.uhead h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.usel{color:#1A63C9;font-size:12.5px;font-weight:700}
.usec{font-size:20px;font-weight:800;margin:4px 0 -6px}
.ucard{background:#fff;border:1px solid #E9E9E9;border-radius:6px;padding:18px 20px;min-width:0}
.ucard>h2,.ucard h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ucard .row>h2{margin-bottom:0}
.ucard>.row{margin-bottom:14px}
.usub{font-size:17px;font-weight:800;margin:20px 0 10px}
.dash{color:#9AA0A6}
.red{color:var(--late)}
.grn{color:#1C8C3C}

/* Synthèse */
.scards{gap:14px}
.scard{background:#fff;border:1px solid #E3E3E3;border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.scard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scard .ttl{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.scard .ttl svg{color:var(--orange)}
.scard .bd{font-size:13px;color:#777;display:flex;flex-direction:column;gap:1px;flex:1}
.scard .bd b{color:#222}
.scard .bd.bul div::before{content:"▪";color:var(--orange);margin-right:8px}
.more{display:inline-flex;align-items:center;gap:22px;background:none;border:0;border-top:1px solid #E3E3E3;padding:10px 0 0;color:var(--orange);font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.more svg{color:var(--orange)}
.sbot{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px}
.sbot .card{border-radius:4px}
.sbot .card h2{font-size:15.5px}
.sbot .card h2 svg{color:var(--orange)}
.sbot .more{border-top:0;margin-top:10px}
.stx{font-weight:600;font-size:12.5px}
.stx::before{content:"• "}
.stx.info{color:#2D7FD3}.stx.or{color:var(--orange-d)}.stx.ok{color:var(--ok)}
.seg2{display:flex;gap:4px;justify-content:center;margin-top:14px}
.seg2 button{border:1px solid #DDD;background:#fff;border-radius:3px;padding:4px 8px;font-size:11.5px;font-weight:700;color:#666;cursor:pointer}
.seg2 button.on{background:var(--orange);border-color:var(--orange);color:#fff}

/* Tableaux des univers */
.utbl{overflow-x:auto;border:1px solid #E5E7EB;border-radius:6px;background:#fff}
.utbl table{font-size:13px}
.utbl th{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:#222;background:#EDF0F4;padding:11px 10px;white-space:normal}
.utbl td{padding:9px 10px;border-right:1px solid #EEF0F2;border-bottom:1px solid #EEF0F2}
.utbl td:last-child{border-right:0}
.utbl tr:last-child td{border-bottom:0}
.empty.sm{padding:12px}
.subcard{border:1px solid #E5E7EB;border-radius:6px;padding:12px 14px;margin-top:14px}
.subcard h3{font-size:16px;font-weight:800;margin:0 0 10px}
.subcard .row h3{margin:0}
.subcard>.row{margin-bottom:10px}

/* KYC */
.kytop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(220px,.9fr);gap:16px;align-items:center;border-bottom:1px solid #EEE;padding-bottom:10px}
.kname{font-size:14px;color:#555}
.kname b{font-size:17px;color:#111}
.kcat{font-size:14px;color:#555;border-left:1px solid #E3E3E3;padding-left:16px;line-height:1.6}
.kcat b{color:#111}
.kytop .mid{border:1px solid #E3E3E3;border-radius:4px;padding:6px 12px;font-size:14px}
.kybody{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:12px}
.ukv{display:grid;grid-template-columns:max-content 1fr;gap:5px 26px;font-size:14px;margin:0;padding-left:20px}
.ukv dt{color:#5F6B7A}
.ukv dd{margin:0;font-weight:700;color:#111}
.vtag{display:inline-block;background:#E3F6EA;color:#14873E;font-weight:700;padding:1px 6px}
.vtag.red{background:var(--late-bg);color:var(--late)}
.kyact{align-items:flex-start;gap:16px}
.kyact .btn{gap:26px;border-radius:4px}

/* Telco */
.stnum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(240px,.9fr);gap:20px;align-items:start}
.stnum>.ukv:nth-child(2){border-left:1px solid #E3E3E3}
.dotv::before{content:"● ";font-size:10px}
.dotv.ok{color:#14873E}.dotv.ok::before{color:#1F9D55}
.dotv.late{color:var(--late)}
.puk{border:1px solid #E3E3E3;border-radius:6px;padding:14px 16px;color:#5F6B7A}
.puk b{color:#111;font-size:15px}
.pk{font-size:16px;color:#111;font-weight:700;letter-spacing:.08em}
.puk .iconbtn{border:0;color:#111}
.fid{background:#F7F8FA;border:1px solid #E5E7EB;border-radius:6px;padding:12px 16px;width:min(320px,100%);margin-top:16px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.tiles{gap:14px}
.tile{background:#F7F8FA;border:1px solid #E5E7EB;border-radius:6px;padding:14px 16px;display:flex;gap:16px;align-items:center;font-size:14px;color:#5F6B7A}
.tile svg{color:#2D7FD3;flex-shrink:0}
.tile b{color:#111}
.tile .tt{font-size:15px;margin-bottom:2px}
.units{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:16px 14px 4px;font-size:15px}
.acts{display:flex;gap:4px}
.ab{border:0;background:none;padding:2px;cursor:pointer;color:#555;border-radius:6px}
.ab:hover{background:#EEF0F2}
.ab.del{color:var(--late)}
.vd{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--orange);font-size:14px;cursor:pointer;padding:0;white-space:nowrap}
.vd[aria-expanded="true"] svg{transform:rotate(180deg)}
tr.vasdet td{padding:0;border-right:0}
.vasp{border:1.5px dashed var(--orange);background:#F8F9FA;padding:14px 16px}
.vasp h3{font-size:20px;font-weight:800;margin:0 0 12px}
.vasp .f .k{font-size:14px;color:#888}
.vasp .t{font-weight:700;font-size:16px;margin-bottom:8px}
.fam{gap:60px;font-size:15px;color:#5F6B7A;margin-bottom:6px}
.fam b{color:#111}

/* Orange Money */
.omgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:16px}
.obox{border:1.5px solid #E1E1E1;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.obox h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.obox .big{font-size:26px;font-weight:800}
.obox .btn{align-self:flex-start;border-radius:4px}
.ocols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ocols.two{grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid #EEE;padding-top:10px;margin-top:4px}
.ocols .f .k,.seccols .f .k{font-size:14px;color:#777}
.ocols .f .v,.seccols .f .v{font-size:15px;font-weight:700}
.big2{font-size:21px!important;font-weight:800}
.ikv{display:grid;grid-template-columns:max-content 1fr;column-gap:28px;margin:0;font-size:15px}
.ikv dt{color:#6E6E6E;padding:7px 0;border-bottom:1px solid #EEE}
.ikv dd{margin:0;padding:7px 0;border-bottom:1px solid #EEE;color:#111}
.ikv.plain dt,.ikv.plain dd{border-bottom:0;padding:4px 0}
.lim{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:12px;font-size:15px;color:#6E6E6E}
.lbar{height:10px;border-radius:6px;background:#D5D5D5;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--orange);border-radius:6px}
.seccols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.seccols .f .pill{align-self:flex-start}
.btn.grnb{background:#15955F;color:#fff;border-radius:4px}
.btn.red{border-radius:4px}
.sti{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sti i{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.per{display:flex;align-items:center;gap:10px;border:1px solid #E3E3E3;border-radius:7px;padding:5px 12px}
.inp.dt{width:140px;padding:4px 8px;font-size:12px}

/* Fibre, Énergie */
.fcols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:10px}
.fcols .f{padding:4px 16px;border-left:1px solid #E3E3E3}
.fcols .f:first-child{border-left:0;padding-left:70px}
.fcols .k{font-size:14px;color:#6E6E6E}
.fcols .v{font-size:14.5px;font-weight:700}
.fcols .f:last-child .v{white-space:nowrap}
.fgrid2{grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:16px}
.encols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;border-top:1px solid #DDD;padding-top:12px}
.encols>dl+dl{border-left:1px solid #E3E3E3;padding-left:24px}
.okline{display:inline-flex;align-items:center;gap:10px;color:#1C8C3C;font-size:15px}

@media (max-width:1100px){
  .idcols,.seccols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .omgrid,.sbot,.fgrid2,.stnum,.kytop{grid-template-columns:minmax(0,1fr)}
  .fcols{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 0}
  .fcols .f:first-child{padding-left:16px}
  .ocols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lcard .lines{padding-left:0}
  .kcat{border-left:0;padding-left:0}
  .stnum>.ukv:nth-child(2){border-left:0}
}
@media (max-width:860px){
  .hero{margin:-16px -16px 0;padding-left:16px;padding-right:16px}
  .chead{margin:-16px -16px 0}
  .idcard,.lcard,.utabs{padding-left:16px;padding-right:16px}
  .hero h1{font-size:28px}
  .hsearch{flex-direction:column}
  .hbtn{min-width:0}
  .hupd{grid-template-columns:minmax(0,1fr)}
  .lcard .lines{grid-template-columns:minmax(0,1fr)}
  .top form{display:none}
  .idtop{flex-direction:column;align-items:flex-start;gap:10px}
  .idlab{padding:12px 18px;font-size:16px}
  .utabs{justify-content:flex-start}
  .utabs button{padding:12px 14px 10px}
  .encols,.seccols,.fcols,.idcols{grid-template-columns:minmax(0,1fr)}
  .idc,.idc:first-child,.fcols .f,.fcols .f:first-child{border-left:0;padding-left:0}
  .encols>dl+dl{border-left:0;padding-left:0}
  .per{flex-wrap:wrap}
  .hs.sm input{width:100%}
  .lim{grid-template-columns:minmax(0,1fr)}
  .ukv{grid-template-columns:minmax(0,1fr);gap:0;padding-left:0}
  .ukv dd{margin-bottom:6px}
  .kybody{flex-direction:column}
  .units{margin:12px 0 0}
  .fam{gap:10px;flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Charte unique : les écrans du ticketing reprennent le style des maquettes Vue 360 ===== */
.crumb{font-size:14px;color:#666;gap:8px}
.crumb::before{content:"‹";font-size:18px;line-height:1;color:#666;margin-right:2px}
.crumb a{color:#666}
.crumb a:hover{color:var(--orange)}
.crumb b{color:#666;font-weight:400}
.ph h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.card{border:1px solid #E9E9E9;border-radius:6px;padding:18px 20px}
.card h2{font-size:18px;font-weight:800;gap:10px}
.card h2 svg{color:var(--orange);width:22px;height:22px}
.card-h{margin-bottom:14px}
.stat{border:1px solid #E9E9E9;border-radius:6px}
.stat .l{font-size:13px;color:#555}
.tbl-wrap{border:1px solid #E5E7EB;border-radius:6px}
th{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500;color:#222;background:#EDF0F4;padding:11px 12px;border-bottom:1px solid #E5E7EB}
td{border-bottom:1px solid #EEF0F2}
tr:last-child td{border-bottom:0}
.tabs{background:#F2F2F2;border-bottom:1.5px solid #8E8E8E;justify-content:center;gap:6px;padding:0 12px}
.tabs button{border-bottom:3px solid transparent;padding:14px 22px 11px;font-size:15px;color:#444}
.tabs button.on{color:var(--orange);border-color:var(--orange)}
.lbl{font-size:15px;font-weight:800;color:#222;text-transform:none;letter-spacing:0}
.fld label{font-size:13px;font-weight:600;color:#444;text-transform:none;letter-spacing:0}
.sysbox .sh{text-transform:none;letter-spacing:0;font-size:13px;color:#222}
.kv{font-size:14px;gap:7px 16px}
.kv dt{color:#6E6E6E}
.kv dd{color:#111}
.btn.s{border-color:var(--orange);color:var(--orange-d);background:var(--card)}
.btn.s:hover{border-color:var(--orange);background:var(--orange-ll)}
.t-head h1{font-size:30px}
.decide .lbl{font-size:15px}
.btn.dk{background:var(--orange);color:#fff}
.inp.todo{border-color:var(--orange);background:var(--orange-ll)}
.btn.dk:hover{background:var(--orange-d)}
.ncli{background:#fff;border:1px solid #E9E9E9;border-radius:6px;overflow:hidden}
.ncli .idcard{padding:0 20px 14px;border-bottom:1px solid #EEE}
.ncli .nline{display:flex;align-items:flex-end;gap:16px;padding:12px 20px;flex-wrap:wrap}
@media (max-width:860px){.ncli .idcard{padding:0 16px 12px}.ncli .nline{padding:12px 16px}}
/* Codification du cadre v1.4 : encadré « Proposé par le motif » */
.fiche{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:7px 16px;font-size:13.5px;margin:14px 0 0;padding:14px 16px;border:1px dashed var(--orange);border-radius:6px;background:var(--orange-ll)}
.fiche .fh{grid-column:1/-1;font-weight:800;font-size:14px;color:#222;margin-bottom:2px}
.fiche dt{color:#6E6E6E}
.fiche dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.fiche dd div+div{margin-top:3px}
@media (max-width:520px){.fiche{grid-template-columns:minmax(0,1fr)}.fiche dd{margin-bottom:6px}}
</style>
</head>

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const msisdnFmt = m => { const d = String(m || "").replace(/\D/g, "").slice(-8); return d.length === 8 ? "+226 " + d.replace(/(\d{2})(?=\d)/g, "$1 ").trim() : (m || "—"); };
const digits = s => String(s || "").replace(/\D/g, "").slice(-8);
const pad = n => String(n).padStart(2, "0");
function dt(ts) { const d = new Date(ts); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function dshort(ts) { const d = new Date(ts); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function isoDay(ts) { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function dur(ms) {
  ms = Math.max(0, ms); const m = Math.round(ms / MIN);
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 48) return h + " h" + (r ? " " + pad(r) : "");
  return Math.floor(h / 24) + " j " + (h % 24) + " h";
}
function ago(ts) { const d = now() - ts; if (d < MIN) return "à l'instant"; return "il y a " + dur(d); }
const money = n => (Number(n) || 0).toLocaleString("fr-FR").replace(/ | /g, " ") + " F";
const slaLabel = min => min === 0 ? "Instantané" : min == null ? "À définir" : min < 60 ? min + " min" : (min / 60) + " h";
const initials = n => n.split(/\s+/).map(x => x[0]).slice(0, 2).join("").toUpperCase();

/* =========================================================
   RÉFÉRENTIEL APPLIQUÉ (avec surcharges du paramétrage)
   ========================================================= */
const levelsOf = t => motifByCode(t.motif).chains[t.chain];
const lvlDef = (t, i) => levelsOf(t)[i == null ? t.lvl : i];
const cfgKey = (code, chain, i) => code + "|" + chain + "|" + i;
function slaOf(code, chain, i) {
  const k = cfgKey(code, chain, i);
  if (k in state.cfg.sla) return state.cfg.sla[k];
  return motifByCode(code).chains[chain][i].sla;
}
function autoOf(code, chain, i) {
  const k = cfgKey(code, chain, i);
  if (k in state.cfg.auto) return state.cfg.auto[k];
  return !!motifByCode(code).chains[chain][i].autoEscalate;
}
function incidentOf(code) { return Object.assign({}, motifByCode(code).incident, state.cfg.incident[code] || {}); }

function pctState(p) { return p >= 1 ? "late" : p >= 0.8 ? "warn" : p >= 0.5 ? "mid" : "ok"; }
function slaInfo(t) {
  const end = t.closed ? t.closed.at : now();
  const gTot = motifByCode(t.motif).slaGlobalH * H;
  const gEl = end - t.createdAt;
  const g = { total: gTot, elapsed: gEl, pct: gEl / gTot, state: pctState(gEl / gTot), remaining: gTot - gEl };
  const min = t.isAlert ? null : slaOf(t.motif, t.chain, t.lvl);
  let l;
  if (min === 0) l = { kind: "inst", state: "ok", pct: 0 };
  else if (min == null) l = { kind: "none", state: "none", pct: 0 };
  else {
    const tot = min * MIN, el = end - t.enteredAt;
    l = { kind: "timed", total: tot, elapsed: el, pct: el / tot, state: pctState(el / tot), remaining: tot - el };
  }
  return { g, l };
}
const STATE_COLOR = { ok: "var(--ok)", mid: "var(--mid)", warn: "var(--warn)", late: "var(--late)", none: "var(--faint)" };
const STATE_CLASS = { ok: "t-ok", mid: "t-mid", warn: "t-warn", late: "t-late", none: "t-grey" };
const STATE_TXT = { ok: "Dans les temps", mid: "Mi-parcours", warn: "Alerte 80 %", late: "Dépassé", none: "SLA à définir" };

/* =========================================================

function hist(t, e) { t.history.push(Object.assign({ at: now(), by: state.user || "system", lvl: t.lvl }, e)); }
function notify(target, text, tk, kind) {
  state.notifs.unshift({ id: "n" + state.counters.n++, at: now(), team: target.team || null, user: target.user || null, sup: !!target.sup, text, tk, kind: kind || "info", read: [] });

}

}
function audit(system, msisdn, tk, detail) {

}
function myNotifs() {
  const u = me(); if (!u) return [];

}

/* =========================================================
   DROITS
   ========================================================= */
const inTeam = (u, team) => !!u && u.teams.includes(team);
const supervises = (u, team) => !!u && (u.supervises === "*" || (Array.isArray(u.supervises) && u.supervises.includes(team)));
function canAct(t, u) { u = u || me(); return !!u && t.status !== "Clos" && inTeam(u, t.team) && (t.status === "En cours" || t.assignedTo === u.id); }
function mustTake(t, u) { u = u || me(); return canAct(t, u) && t.status === "En cours"; }
function teamMembers(team) { return USERS.filter(u => u.teams.includes(team)); }

/* =========================================================
   DONNÉES ORANGE MONEY, PLAINTES, UNITÉS (simulées, mutables)
   ========================================================= */
function txList(m) { return (PAYX_TX[m] || []).map(x => Object.assign({}, x, { at: state.t0 - x.ago, from: m, blocked: state.payx.blocked[x.id] || null, refunded: !!state.payx.refunded[x.id] })); }
function txById(id) { for (const m in PAYX_TX) { const x = txList(m).find(y => y.id === id); if (x) return x; } return null; }
const rcvOf = m => RECEIVERS[m] || { st: "Actif", solde: 50000 };
function txSmsText(x) {
  const to = /^\d+$/.test(x.to) ? msisdnFmt(x.to) : x.to;
  if (x.st === "Échouée") return "Échec de la transaction " + x.id + " de " + money(x.montant) + " : " + (x.why || "transaction non aboutie").toLowerCase() + ".";
  if (x.st === "Ambiguë" || x.st === "Initiated") return "Transaction de " + money(x.montant) + " en cours de traitement… Réf. " + x.id + ".";

  if (/Airtime/.test(x.type)) return "Achat de crédit de " + money(x.montant) + " pour le " + to + " effectué. Réf. " + x.id + ".";
  if (x.type === "Paiement marchand") return "Paiement de " + money(x.montant) + " à " + to.replace("Marchand · ", "") + " effectué. Réf. " + x.id + ".";
  return "Transfert de " + money(x.montant) + " vers le " + to + " effectué. Réf. " + x.id + ".";
}
function unitsOf(m) {
  const base = UNITS[m] || { avail: 99999, active: true };

}
function frozen(m) { return !state.unfrozen[m] && !!sysFor(m).ecms.gel; }

function newCode() { return "TC" + (state.counters.tc++); }
function newOps() { return "PL-" + (state.counters.ops++); }

/* =========================================================
   CYCLE DE VIE DU TICKET
   ========================================================= */
/* Ticket en cours sur la même transaction (création impossible) ou pour le même client et le même motif
   (l'agent est averti et doit confirmer qu'il s'agit d'un nouveau ticket ; la confirmation est journalisée) */
function findDuplicate(code, clientId, txId) {
  const open = t => !t.isAlert && t.status !== "Clos";
  return (txId && state.tickets.find(t => open(t) && t.data && t.data.txId === txId)) ||
    state.tickets.find(t => open(t) && t.motif === code && t.clientId === clientId) || null;
}
const sameTxDup = (dup, d) => !!(dup && d.txId && dup.data && dup.data.txId === d.txId);

function createTicket(o) {
  const u = me(), m = motifByCode(o.motif), chain = m.chainFor(o.channel), at = now();
  const t = {
    id: "TK-" + (state.counters.tk++), motif: o.motif, chain, channel: o.channel, clientId: o.clientId, msisdn: o.msisdn,
    createdAt: at, createdBy: u.id, lvl: 0, team: m.chains[chain][0].team, status: "Instance", assignedTo: u.id, enteredAt: at,
    fields: Object.assign({}, o.fields), tasks: { 0: Object.assign({}, o.tasks) }, checks: { 0: Object.assign({}, o.checks) }, checkNotes: { 0: Object.assign({}, o.checkNotes) }, calls: {},
    data: Object.assign({}, o.data), attachments: o.attachments || [], history: [], sms: [],
    flags: { escalated: false, pre: {}, breach: {}, gbreach: false }, closed: null, alertId: null, batchId: null
  };
  state.tickets.unshift(t);
  hist(t, { kind: "create", text: "Ticket créé par " + u.name + " (canal " + o.channel + ") — " + m.label });
  (o.sysLog || []).forEach(s => hist(t, { kind: "sys", text: s }));
  sms(t, t.msisdn, "Orange : votre réclamation " + t.id + " (" + m.label + ") est enregistrée. Délai maximal de traitement : " + m.slaGlobalH + " h.");
  if (o.decision === "close") closeTicket(t, o.reason, o.comment);
  else if (o.decision === "forward") forwardTicket(t, o.reason, o.comment, { instant: !!lvlDef(t, 0).instant });
  if (t.status !== "Clos") checkIncident(t);
  save();
  return t;
}

function forwardTicket(t, reason, comment, opt) {
  opt = opt || {};
  const from = lvlDef(t), next = levelsOf(t)[t.lvl + 1];
  if (!next) return false;
  const at = opt.at || now();
  t.lvl += 1; t.team = next.team; t.status = "En cours"; t.assignedTo = null; t.enteredAt = at;
  if (opt.auto) t.flags.escalated = true;
  if (t.data) t.data.returned = null;
  t.tasks[t.lvl] = t.tasks[t.lvl] || {}; t.checks[t.lvl] = t.checks[t.lvl] || {};
  hist(t, { at, by: opt.auto ? "system" : state.user, kind: opt.auto ? "auto" : "forward",
    text: from.n === next.n ? "Étape suivante du N" + next.n + " → " + lvlName(next) : (opt.auto ? "Escalade automatique" : opt.instant ? "Passage instantané" : "Transfert") + " N" + from.n + " → " + lvlName(next),
    reason, comment });
  notify({ team: next.team }, (opt.auto ? "Escalade automatique : " : "Nouveau ticket dans votre file : ") + t.id + " — " + motifByCode(t.motif).label + " · " + lvlName(next), t.id, opt.auto ? "late" : "info");
  return true;
}

function returnTicket(t, toIdx, reason, comment) {
  const from = lvlDef(t), to = levelsOf(t)[toIdx];
  t.lvl = toIdx; t.team = to.team; t.status = "En cours"; t.assignedTo = null; t.enteredAt = now();
  t.data.returned = { from: from.n, reason };
  t.tasks[t.lvl] = t.tasks[t.lvl] || {}; t.calls[t.lvl] = null;
  hist(t, { kind: "return", text: "Retour N" + from.n + " → " + lvlName(to), reason, comment });
  notify({ team: to.team }, "Ticket retourné au " + lvlName(to) + " : " + t.id + " — " + reason, t.id, "warn");
}

function closeTicket(t, reason, comment, opt) {
  opt = opt || {};
  const at = now();
  t.status = "Clos"; t.closed = { at, by: opt.system ? "system" : state.user, lvl: t.lvl, reason, comment };
  hist(t, { kind: "close", by: opt.system ? "system" : state.user, text: "Ticket clos au " + lvlName(lvlDef(t)), reason, comment });
  if (/SIM démagnétisée/.test(reason)) sms(t, t.msisdn, "Orange : merci de vous présenter dans une boutique Orange avec votre pièce d'identité pour le remplacement de votre carte SIM (réclamation " + t.id + ").");
  sms(t, t.msisdn, "Orange : votre réclamation " + t.id + " est clôturée. " + reason + ". Merci de votre confiance.");
  if (t.isAlert) {
    (t.children || []).forEach(id => {
      const c = getT(id);
      if (c && c.status !== "Clos") closeTicket(c, "Clos automatiquement à la clôture de l'alerte " + t.id + " — " + reason, comment, { system: true });
    });

}

function takeTicket(t) {
  const u = me(); t.status = "Instance"; t.assignedTo = u.id;
  hist(t, { kind: "take", text: "Pris en charge par " + u.name + " (" + lvlName(lvlDef(t)) + ")" });
}
function reassignTicket(t, toUser, why) {
  const u = me(), from = t.assignedTo ? userById(t.assignedTo).name : "file " + TEAMS[t.team].label, target = userById(toUser);
  t.assignedTo = toUser; t.status = "Instance";
  hist(t, { kind: "assign", text: "Réassigné par " + u.name + " : " + from + " → " + target.name, reason: why });
  notify({ user: toUser }, "Ticket réassigné à vous : " + t.id, t.id, "info");
}
function unassignTicket(t, why) {
  const u = me(), from = t.assignedTo ? userById(t.assignedTo).name : "";
  t.assignedTo = null; t.status = "En cours";
  hist(t, { kind: "assign", text: "Remis dans la file " + TEAMS[t.team].label + " par " + u.name + (from ? " (était assigné à " + from + ")" : ""), reason: why });
}
const getT = id => state.tickets.find(t => t.id === id);

/* =========================================================
   MOTEUR SLA : pré-alerte 80 %, dépassement, escalade auto
   ========================================================= */
function tick() {
  let changed = false, guard = 0;
  let again = true;
  while (again && guard++ < 20) {
    again = false;
    for (const t of state.tickets) {
      if (t.status === "Clos" || t.isAlert) continue;
      const { g, l } = slaInfo(t), d = lvlDef(t), k = String(t.lvl);
      if (g.pct >= 1 && !t.flags.gbreach) {
        t.flags.gbreach = true; changed = true;
        hist(t, { at: t.createdAt + g.total, by: "system", kind: "breach", text: "SLA global de " + motifByCode(t.motif).slaGlobalH + " h dépassé" });
        notify({ sup: true, team: t.team }, "SLA global dépassé : " + t.id, t.id, "late");
      }
      if (l.kind !== "timed") continue;
      if (l.pct >= 0.8 && !t.flags.pre[k]) {
        t.flags.pre[k] = true; changed = true;
        const auto = autoOf(t.motif, t.chain, t.lvl) && levelsOf(t)[t.lvl + 1];
        hist(t, { at: t.enteredAt + l.total * 0.8, by: "system", kind: "pre", text: "Pré-alerte : 80 % du SLA N" + d.n + " atteint" + (auto ? " — escalade automatique à l'échéance" : "") });
        notify({ team: t.team }, "Pré-alerte SLA " + t.id + " : échéance N" + d.n + " dans " + dur(l.remaining), t.id, "warn");
      }
      if (l.pct >= 1 && !t.flags.breach[k]) {
        t.flags.breach[k] = true; changed = true;
        const breachAt = t.enteredAt + l.total;
        if (autoOf(t.motif, t.chain, t.lvl) && levelsOf(t)[t.lvl + 1]) {
          forwardTicket(t, "SLA dépassé", "SLA N" + d.n + " (" + slaLabel(slaOf(t.motif, t.chain, t.lvl)) + ") dépassé", { auto: true, at: breachAt });
          again = true;
        } else {
          hist(t, { at: breachAt, by: "system", kind: "breach", text: "SLA N" + d.n + " dépassé — ticket signalé en rouge au superviseur" });
          notify({ sup: true, team: t.team }, "SLA N" + d.n + " dépassé : " + t.id, t.id, "late");
        }
      }
    }
  }
  if (changed) save();
  return changed;
}

/* =========================================================
   ALERTES INCIDENT (regroupement au-delà d'un seuil)
   ========================================================= */
function openAlertFor(code) { return state.tickets.find(t => t.isAlert && t.motif === code && t.status !== "Clos"); }
function checkIncident(t) {
  const cfg = incidentOf(t.motif);
  if (!cfg.enabled || t.isAlert) return;
  const al = openAlertFor(t.motif);
  if (al) { attachToAlert(al, t); return; }
  const win = cfg.windowH * H;
  const peers = state.tickets.filter(x => !x.isAlert && x.motif === t.motif && x.status !== "Clos" && !x.alertId && now() - x.createdAt <= win);
  if (peers.length >= cfg.threshold) {
    const m = motifByCode(t.motif), lv = Math.min(cfg.level, m.chains.std.length - 1), def = m.chains.std[lv];
    const a = {
      id: "INC-" + String(state.counters.inc++).padStart(4, "0"), isAlert: true, motif: t.motif, chain: "std", channel: "Système",
      clientId: null, msisdn: null, createdAt: now(), createdBy: "system", lvl: lv, team: def.team, status: "En cours", assignedTo: null, enteredAt: now(),
      fields: {}, tasks: {}, checks: {}, checkNotes: {}, calls: {}, data: {}, attachments: [], history: [], sms: [], flags: { escalated: false, pre: {}, breach: {}, gbreach: false },
      closed: null, children: []
    };
    state.tickets.unshift(a);
    hist(a, { by: "system", kind: "alert", text: "Alerte incident créée automatiquement : " + peers.length + " tickets « " + m.label + " » ouverts en moins de " + cfg.windowH + " h (seuil " + cfg.threshold + ")" });
    peers.forEach(p => attachToAlert(a, p));
    notify({ team: def.team, sup: true }, "Alerte incident " + a.id + " — " + m.label + " · " + lvlName(def) + " (" + peers.length + " tickets)", a.id, "late");
  }
}
function attachToAlert(a, t) {
  if (a.children.includes(t.id)) return;
  a.children.push(t.id); t.alertId = a.id;
  const def = levelsOf(a)[a.lvl];
  if (t.lvl < a.lvl) { t.lvl = a.lvl; t.team = def.team; t.status = "En cours"; t.assignedTo = null; t.enteredAt = now(); t.tasks[t.lvl] = t.tasks[t.lvl] || {}; }
  hist(t, { by: "system", kind: "alert", text: "Rattaché à l'alerte incident " + a.id + " et remonté au " + lvlName(def) });
  hist(a, { by: "system", kind: "alert", text: "Ticket " + t.id + " rattaché (" + msisdnFmt(t.msisdn) + ")" });
}

/* =========================================================
   BATCHS DE REMBOURSEMENT AIRTIME
   ========================================================= */
function refundAmount(t) { return t.data.debit && t.data.debit.result !== "inactive" ? t.data.debit.amount : Number(t.fields.montant) || 0; }
function createBatch(ids) {
  const u = me(), b = { id: "B-" + String(state.counters.batch++).padStart(4, "0"), tickets: ids.slice(), at: now(), by: u.id, status: "v1", history: [] };
  b.total = ids.reduce((s, id) => s + refundAmount(getT(id)), 0);
  b.history.push({ at: now(), by: u.id, text: "Batch de remboursement initié (" + ids.length + " plainte(s), " + money(b.total) + ")" });
  state.batches.unshift(b);
  ids.forEach(id => {
    const t = getT(id); t.batchId = b.id; t.tasks[t.lvl] = Object.assign(t.tasks[t.lvl] || {}, { extract: true, excel: true, batch: true });
    hist(t, { kind: "batch", text: "Inclus dans le batch de remboursement " + b.id });
    forwardTicket(t, "Batch de remboursement initié (" + b.id + ")", "");
  });
  notify({ team: "resp_om_1" }, "Batch " + b.id + " à valider (validation 1) — " + money(b.total), ids[0], "info");
  return b;
}
function validateBatch(b, step) {
  const u = me();
  if (step === 1) {
    b.status = "v2"; b.v1 = { at: now(), by: u.id };
    b.history.push({ at: now(), by: u.id, text: "Validation 1 accordée" });
    b.tickets.forEach(id => { const t = getT(id); if (t.status === "Clos") return; t.tasks[t.lvl] = { v1: true }; hist(t, { kind: "validate", text: "Remboursement validé (validation 1) — batch " + b.id }); forwardTicket(t, "Validation 1 accordée", ""); });
    notify({ team: "resp_om_2" }, "Batch " + b.id + " à valider (validation 2) — " + money(b.total), b.tickets[0], "info");
  } else {
    b.status = "done"; b.v2 = { at: now(), by: u.id };
    b.history.push({ at: now(), by: u.id, text: "Validation 2 accordée — remboursements exécutés automatiquement" });
    b.tickets.forEach(id => {
      const t = getT(id); if (t.status === "Clos") return;
      t.tasks[t.lvl] = { v2: true };
      const amt = refundAmount(t), ref = "RB-" + (state.counters.rb++);
      t.data.refund = { at: now(), amount: amt, ref };
      hist(t, { kind: "validate", text: "Remboursement validé (validation 2) — batch " + b.id });
      hist(t, { by: "system", kind: "sys", text: "Remboursement automatique de " + money(amt) + " exécuté (réf. " + ref + ")" });
      sms(t, t.msisdn, "Orange Money : remboursement de " + money(amt) + " effectué sur votre compte (réclamation " + t.id + ").");
      closeTicket(t, "Remboursé automatiquement après la validation 2", "Batch " + b.id + " · réf. " + ref, { system: true });
    });
  }
}
function rejectBatch(b, step, why) {
  const u = me(); b.status = "rejected"; b.rejected = { at: now(), by: u.id, step, why };
  b.history.push({ at: now(), by: u.id, text: "Rejeté à la validation " + step + " : " + why });
  b.tickets.forEach(id => {
    const t = getT(id); if (t.status === "Clos") return;
    const back = levelsOf(t).findIndex(l => l.kind === "batch");
    t.batchId = null; t.tasks[back] = {};
    returnTicket(t, back, "Batch " + b.id + " rejeté à la validation " + step, why);
  });
}

/* =========================================================
   JEU DE DONNÉES DE DÉMONSTRATION
   ========================================================= */
function mk(o) {
  const m = motifByCode(o.motif), chain = o.chain || "std";
  return Object.assign({
    motif: o.motif, chain, isAlert: false, lvl: 0, status: "En cours", assignedTo: null,
    fields: {}, tasks: {}, checks: {}, checkNotes: {}, calls: {}, data: {}, attachments: [], history: [], sms: [],
    flags: { escalated: false, pre: {}, breach: {}, gbreach: false }, closed: null, alertId: null, batchId: null
  }, o, { team: m.chains[chain][o.lvl || 0].team });
}
function seed() {
  state = blank();

function omMoves(c) {

    if (x.refunded) { out.push([x.at + H, x.id, "Remboursement " + x.type.toLowerCase(), 0, x.montant, bal]); bal -= x.montant; }
    if (x.st === "Échouée") return;

  });

}

/* =========================================================
   CRÉATION DE TICKET (travail du niveau 1)
   ========================================================= */
function draftFor(o) {
  const c = o.client ? clientById(o.client) : null;
  const d = { clientId: c ? c.id : null, msisdn: o.msisdn || (c ? c.lines[0].m : ""), channel: profileChannel(), motif: o.motif || null, univers: o.univers || null, txId: o.tx || null, hist: false,
    fields: {}, tasks: {}, checks: {}, checkNotes: {}, data: {}, sysShown: {}, attachments: [], decision: null, reason: "", comment: "", errors: [], dupOk: false, notice: "" };
  if (d.motif) {
    const m = motifByCode(d.motif); d.univers = m.univ;
    if (!m.channels.includes(d.channel)) { d.notice = "Le motif « " + motifTxt(m) + " » n'est pas ouvert au canal " + d.channel + "."; d.motif = null; d.txId = null; }
    else applyMotifToDraft(d);
  }
  if (d.txId) { d.hist = true; state.ui.txOpen = d.txId; state.ui.txq = ""; }
  return d;
}
const ansOf = v => v === true ? "ok" : v || "";
function checklistHtml(task, answers, notes, live, p) {
  answers = answers || {}; notes = notes || {};
  return '<div class="qlist">' + task.items.map((it, i) => {
    const v = ansOf(answers[i]);
    return '<div class="q"><span class="qt">' + esc(it) + '</span><span class="qb">' +
      [["ok", "OK"], ["ko", "Pas OK"]].map(o => '<button type="button" class="' + (v === o[0] ? "on " + o[0] : "") + '"' + (live ? ' data-a="' + p + 'ans" data-id="' + task.id + '" data-i="' + i + '" data-v="' + o[0] + '"' : " disabled") + ">" + o[1] + "</button>").join("") + "</span>" +
      (v === "ko" ? (live ? '<input class="inp qn" id="' + p + 'qn-' + task.id + '-' + i + '" data-' + p + 'qn="' + i + '" placeholder="Préciser ce qui ne va pas" value="' + esc(notes[i] || "") + '">' : '<div class="qnote">' + esc(notes[i] || "Non précisé") + "</div>") : "") + "</div>";
  }).join("") + "</div>";
}
function checklistGaps(task, answers, notes) {
  answers = answers || {}; notes = notes || {};
  const errs = [], missing = task.items.filter((_, i) => !ansOf(answers[i])).length;
  if (missing) errs.push(task.label + " : " + missing + " question(s) sans réponse.");
  task.items.forEach((it, i) => { if (ansOf(answers[i]) === "ko" && !String(notes[i] || "").trim()) errs.push("Précisez la réponse « Pas OK » : " + it + "."); });
  return errs;
}
const profileChannel = () => (me() && me().channel) || "Call";
const openMotifs = d => MOTIFS.filter(m => m.univ === d.univers && m.channels.includes(d.channel));
function applyMotifToDraft(d) {
  const m = motifByCode(d.motif);
  d.univers = m.univ; d.notice = "";
  d.fields = {}; d.tasks = {}; d.checks = {}; d.checkNotes = {}; d.data = {}; d.sysShown = {}; d.attachments = []; d.decision = null; d.reason = ""; d.errors = []; d.dupOk = false; d.hist = !!d.txId;
  if (m.code === "OM-TRN-020") d.fields.num_appelant = d.msisdn;
  /* Le numéro donné par le client (celui recherché) est l'émetteur : rempli automatiquement, non modifiable */
  if (m.code === "OM-AIR-020") d.fields.num_emetteur = d.msisdn;
  if (d.txId) applyTxToDraft(d, d.txId);
  const lv = m.chains[m.chainFor(d.channel)][0];
  if (!lv.close.length) d.decision = "forward";
  if (d.decision === "forward" && lv.forward.length === 1) d.reason = lv.forward[0];
}
function applyTxToDraft(d, txId) {
  const x = txById(txId), m = motifByCode(d.motif); if (!x || !m || x.type !== m.txType) { d.txId = null; return; }
  d.txId = txId;
  if (d.motif === "OM-TRN-020") Object.assign(d.fields, { num_transaction_om: x.id, date_transaction: isoDay(x.at), montant: x.montant, mauvais_recepteur: x.to });
  if (d.motif === "OM-AIR-020") Object.assign(d.fields, { num_transaction_om: x.id, num_emetteur: x.from, num_receveur: x.to, date_transaction: isoDay(x.at), montant: x.montant });
}
function fieldInput(key, val, opts) {

  if (f.type === "textarea") ctl = '<textarea id="' + id + '" class="' + cls + '" ' + attr + (ro ? " readonly" : "") + ">" + esc(val || "") + "</textarea>";
  else if (f.type === "select") ctl = '<select id="' + id + '" class="' + cls + '" ' + attr + (ro ? " disabled" : "") + '><option value="">Choisir…</option>' + f.options.map(o => '<option' + (val === o ? " selected" : "") + ">" + esc(o) + "</option>").join("") + "</select>";

  else ctl = '<input id="' + id + '" class="' + cls + (f.type === "tel" ? " num" : "") + '" ' + attr + ' type="' + (f.type === "number" ? "number" : f.type === "date" ? "date" : "text") + '"' + (f.type === "tel" ? ' inputmode="numeric" placeholder="ex. 76 76 76 76"' : f.ph ? ' placeholder="' + esc(f.ph) + '"' : "") + ' value="' + esc(f.type === "tel" && val ? msisdnFmt(val).replace("+226 ", "") : val == null ? "" : val) + '"' + (ro ? " readonly" : "") + ">";
  return '<div class="fld' + (f.full ? " full" : "") + '"><label for="' + id + '">' + esc(label) + (req && !ro ? ' <span class="req">*</span>' : "") + "</label>" + ctl + "</div>";
}
/* Chaîne affichée par niveau standard : un seul pas par niveau (le N4 regroupe validation 1 et 2), sans le détail des équipes */
function chainSteps(code, chain) {
  const steps = [];
  motifByCode(code).chains[chain].forEach((l, i) => { const last = steps[steps.length - 1]; if (last && last.n === l.n) last.idx.push(i); else steps.push({ n: l.n, idx: [i] }); });
  steps.forEach(s => { const v = s.idx.map(i => slaOf(code, chain, i)); s.sla = v.some(x => x == null) ? null : v.reduce((a, b) => a + b, 0); });
  return steps;
}
function chainPreview(m, chain, cur) {
  return '<div class="chain compact">' + chainSteps(m.code, chain).map((s, k) => (k ? '<div class="link-l"></div>' : "") + '<div class="step' + (s.idx.includes(cur) ? " cur" : "") + '"><div class="c">N' + s.n + '</div><div class="t">' + esc(NIVEAUX[s.n]) + '</div><div class="s">' + esc(slaLabel(s.sla)) + "</div></div>").join("") + "</div>";
}

/* Ticket déjà en cours pour le même motif : informations du ticket et confirmation d'un nouveau ticket */
function dupNotice(d, m) {
  const dup = findDuplicate(m.code, d.clientId, d.txId); if (!dup) return "";
  const same = sameTxDup(dup, d), last = lastAction(dup);
  const rows = [["Ticket", '<button class="link" data-a="go" data-to="ticket-' + dup.id + '">' + dup.id + "</button>"], ["Motif", esc(motifByCode(dup.motif).label)],
    ["Créé le", esc(dt(dup.createdAt)) + " par " + esc(uname(dup.createdBy)) + " (canal " + esc(dup.channel) + ")"], ["Niveau actuel", esc(lvlTag(dup))],
    ["Statut", statusPill(dup) + (dup.assignedTo ? " " + esc(uname(dup.assignedTo)) : "")], ["Dernière action", esc(last ? last.text : "—") + (last ? ' <span class="sub">· ' + esc(ago(last.at)) + "</span>" : "")]];
  return '<div class="note warn" style="margin-top:12px">' + ic("alert", 18) + '<div style="flex:1"><b>' + (same ? "Un ticket est déjà ouvert sur cette transaction." : "Un ticket est déjà en cours pour ce client et ce motif.") + "</b>" +
    '<dl class="kv" style="margin:8px 0">' + rows.map(r => "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>").join("") + "</dl>" +
    (same ? "<div>Création impossible pour la même transaction : complétez le ticket existant.</div>"
      : '<label class="chk"><input type="checkbox" data-a-change="ddup"' + (d.dupOk ? " checked" : "") + "><b>Je confirme qu'il s'agit d'une nouvelle plainte</b> (confirmation journalisée)</label>" +

function toast(msg, kind) {

  while (w.children.length >= 2) w.firstChild.remove();

/* Fichiers : export CSV téléchargé directement par le navigateur, sinon affichage pour copie */
const csv = rows => rows.map(r => r.map(v => { v = v == null ? "" : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";")).join("\n");
async function offerFile(filename, text) {
  try {
    const blob = new Blob(["\ufeff" + text], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast("Fichier enregistré : " + filename, "ok");

  state.ui.modal = { title: filename, html: '<p class="sub mt0">Copiez le contenu (séparateur « ; ») et collez-le dans Excel.</p><textarea id="csvtxt" class="inp mono" style="min-height:260px" readonly>' + esc(text) + '</textarea><div class="row"><span class="sp"></span><button class="btn p" data-a="copyCsv">Copier</button></div>' };

/* =========================================================
   VALIDATIONS MÉTIER
   ========================================================= */
function draftErrors(d) {
  const errs = [], ef = [];
  const m = motifByCode(d.motif);
  if (!m) return { errs: ["Choisissez un motif de contact."], ef };
  const lv = m.chains[m.chainFor(d.channel)][0];
  if (m.identite && !d.tasks.kyc) errs.push("Contrôle d'identité exigé pour ce motif : vérifiez le KYC du client (bloc 3, « Voir le KYC ») avant de créer le ticket.");
  if (!d.decision) errs.push("Choisissez la décision du niveau 1.");
  else if (!d.reason) errs.push("Choisissez la raison (" + (d.decision === "close" ? "motif de clôture" : "raison de passage") + ").");
  const req = lv.required.concat(d.decision === "forward" ? (lv.requiredForward || []) : []);
  req.forEach(k => {
    const v = k === "msisdn" ? d.msisdn : k === "num_plainte_ops" ? d.data.opsNo : d.fields[k];
    if (v == null || v === "") { errs.push("Champ obligatoire : " + FIELDS[k].label); ef.push(k); }
  });
  if (d.decision !== "close") lv.tasks.filter(x => x.needed).forEach(x => {
    if (!draftTaskDone(d, x)) errs.push("Action requise : " + x.label);
  });
  if (d.decision === "close" && /Montant non disponible/.test(d.reason) && !(d.data.bal && !d.data.bal.ok)) errs.push("Clôture possible seulement si le solde du numéro erroné, vérifié au clic sur « Bloquer la transaction », ne couvre pas le montant.");
  if (d.decision) lv.tasks.filter(x => x.action === "checklist").forEach(x => checklistGaps(x, d.checks, d.checkNotes).forEach(e => errs.push(e)));
  const dup = findDuplicate(m.code, d.clientId, d.txId);
  if (sameTxDup(dup, d)) errs.push("Un ticket est déjà ouvert sur cette transaction : " + dup.id + ".");
  else if (dup && !d.dupOk) errs.push("Un ticket est déjà en cours pour ce motif (" + dup.id + ") : confirmez qu'il s'agit d'un nouveau ticket.");
  return { errs, ef };
}
function decisionErrors(t, dec) {
  const d = lvlDef(t), errs = [], ef = [];
  if (!dec || !dec.kind) return { errs: ["Choisissez une décision."], ef };
  const isRet = dec.kind.startsWith("return");
  if (!dec.reason) errs.push("Choisissez " + (dec.kind === "close" ? "le motif de clôture." : isRet ? "le résultat transmis au BO telco." : "la raison de passage."));
  const req = d.required.concat(dec.kind === "forward" ? (d.requiredForward || []) : []);
  req.forEach(k => {
    const v = k === "msisdn" ? t.msisdn : k === "code_blocage" ? (t.fields.code_blocage || t.data.code) : t.fields[k];
    if (v == null || v === "") { errs.push("Champ obligatoire : " + FIELDS[k].label); ef.push(k); }
  });
  if (dec.kind === "forward") d.tasks.filter(x => x.needed).forEach(x => { if (!tk(t, x.id) && !(x.action === "ecms_debit" && t.data.debit)) errs.push("Action requise : " + x.label); });
  const r = dec.reason || "", dbt = t.data.debit;
  d.tasks.filter(x => x.action === "checklist").forEach(x => checklistGaps(x, t.checks[t.lvl], (t.checkNotes || {})[t.lvl]).forEach(e => errs.push(e)));
  if (/Forfait dégelé/.test(r) && !t.data.unfrozen) errs.push("Dégelez d'abord le forfait.");
  if (/Informations exactes — client remboursé/.test(r) && !t.data.refund) errs.push("Effectuez d'abord le remboursement.");
  if (/inexactes/.test(r) && t.data.exact !== false) errs.push("Indiquez « Informations inexactes » après la recherche de la transaction.");
  if (/initiated/.test(r) && dec.kind === "forward" && t.data.refundErr !== "initiated") errs.push("Le statut « initiated » doit être constaté par une tentative de remboursement.");
  if (/Compte churn/.test(r) && dec.kind === "forward" && t.data.refundErr !== "churn") errs.push("Le compte churn doit être constaté par une tentative de remboursement.");
  if (/Difficulté de remboursement/.test(r) && !t.data.refundErr) errs.push("Tentez d'abord le remboursement.");
  if (/Unités débitées/.test(r) && !(dbt && ["full", "partial"].includes(dbt.result))) errs.push("Débitez d'abord les unités.");
  if (/N° receveur désactivé/.test(r) && !(dbt && dbt.result === "inactive")) errs.push("Le débit des unités doit constater un numéro receveur désactivé.");
  if (/Unités consommées/.test(r) && !(dbt && dbt.result === "consumed")) errs.push("Le débit des unités doit constater que les unités sont consommées.");
  if (/par les Opérations|churn régularisé|fonds restitués/.test(r) && !t.data.refund) errs.push("Effectuez d'abord la régularisation et le remboursement.");
  if (isRet && /SIM démagnétisée/.test(r) && d.tasks.some(x => x.id === "hlr") && !tk(t, "hlr")) errs.push("Vérifiez le profil réseau du client pour établir le diagnostic avant le retour.");
  return { errs, ef };
}
