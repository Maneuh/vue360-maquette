/* Blocage depuis le détail d'une transaction : le ticket s'ouvre déjà rempli */
function applyBlockToDraft(d, x, bal, code) {
  const m = motifByCode(d.motif), lv = m.chains[m.chainFor(d.channel)][0];
  d.data.bal = bal; d.tasks.tx = true; d.tasks.solde = true; d.errors = []; d.errFields = [];
  if (code) { d.data.code = code; d.data.tx = { id: x.id, montant: x.montant, to: x.to, st: x.st }; d.tasks.block = true; d.decision = "forward"; d.reason = lv.forward[0]; }
  else { d.decision = "close"; d.reason = lv.close[0]; }
}
function openBlockedDraft(x, bal, code) {
  const c = clientByMsisdn(x.from), d = draftFor({ client: c.id, msisdn: x.from, motif: "OM-TRN-020", tx: x.id });
  if (!d.motif) { state.ui.draft = d; save(); return go("nouveau"); }
  applyBlockToDraft(d, x, bal, code);
  d.hist = false; d.fromBlock = !!code; state.ui.txOpen = null;
  state.ui.draft = d; save(); go("nouveau");
}
function doRefund(t, ops) {
  const amt = Number(t.fields.montant) || (t.data.tx && t.data.tx.montant) || 0, ref = "RB-" + (state.counters.rb++);
  t.data.refund = { at: now(), amount: amt, ref }; t.data.refundErr = null;
  if (t.data.txId) state.payx.refunded[t.data.txId] = true;
  t.tasks[t.lvl] = Object.assign(t.tasks[t.lvl] || {}, { refund: true, analyse: true });
  audit("PayX", t.msisdn, t.id, (ops ? "Régularisation et remboursement" : "Remboursement") + " " + ref);
  hist(t, { kind: "sys", text: (ops ? "Régularisation et remboursement" : "Remboursement") + " de " + money(amt) + " effectué (réf. " + ref + ")" });
  sms(t, t.msisdn, "Orange Money : remboursement de " + money(amt) + " effectué sur votre compte (réclamation " + t.id + ").");
}

    if ((state.ui.bell || state.ui.pmenu) && !e.target.closest(".drop")) { state.ui.bell = false; state.ui.pmenu = false; render(); }
    if (state.ui.menu && !e.target.closest(".side")) { state.ui.menu = false; render(); }
    return;
  }
  if (el.dataset.self && e.target !== el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault();
  if (el.disabled) return;
  try { fn(el, e); } catch (err) { console.error(err); toast("Erreur : " + err.message, "err"); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="checkbox"][data-a]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && state.ui.modal) { state.ui.modal = null; render(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.aChange && C[el.dataset.aChange]) { try { C[el.dataset.aChange](el, e); } catch (err) { console.error(err); toast("Erreur : " + err.message, "err"); } return; }
  if (el.type === "file" && el.dataset.df === "fichier") {
    const f = el.files && el.files[0], d = D(); if (!f || !d) return;
    d.fields.fichier = f.name; d.attachments = [{ name: f.name, size: f.size, type: f.type, at: now() }]; d.tasks.file = true; d.errFields = (d.errFields || []).filter(k => k !== "fichier");
    commit("Fichier joint : " + f.name, "ok");
  }
  if (el.dataset.df !== undefined && el.tagName === "SELECT") { D().fields[el.dataset.df] = el.value; save(); }
  if (el.dataset.tf !== undefined && el.tagName === "SELECT") { const t = curT(); t.fields[el.dataset.tf] = el.value; save(); }
});
function fieldValue(el, key) {
  const f = FIELDS[key];
  if (f.type === "tel") return el.value.replace(/\D/g, "").slice(-8);
  if (f.type === "number") return el.value === "" ? "" : Number(el.value);
  return el.value;
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.df !== undefined && el.type !== "file" && el.tagName !== "SELECT") { const d = D(); if (d) { d.fields[el.dataset.df] = fieldValue(el, el.dataset.df); el.classList.remove("err"); save(); } }
  if (el.dataset.tf !== undefined && el.type !== "file" && el.tagName !== "SELECT") { const t = curT(); if (t) { t.fields[el.dataset.tf] = fieldValue(el, el.dataset.tf); el.classList.remove("err"); save(); } }
  if (el.dataset.dc) { D().comment = el.value; save(); }
  if (el.dataset.dqn !== undefined) { const d = D(); d.checkNotes = d.checkNotes || {}; d.checkNotes[+el.dataset.dqn] = el.value; save(); }
  if (el.dataset.tqn !== undefined) { const t = curT(); t.checkNotes = t.checkNotes || {}; t.checkNotes[t.lvl] = t.checkNotes[t.lvl] || {}; t.checkNotes[t.lvl][+el.dataset.tqn] = el.value; save(); }
  if (el.dataset.tdc) { const t = curT(); state.ui.tdec[t.id] = Object.assign(state.ui.tdec[t.id] || {}, { comment: el.value }); save(); }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const q = (new FormData(f).get("q") || "").toString().trim(), kind = f.dataset.form;
  if (kind === "gsearch" || kind === "home") {
    const mc = MOTIFS.find(x => x.code === q.toUpperCase().replace(/\s/g, ""));
    if (mc) { Object.assign(state.ui.tq, { tab: "all", univ: "", motif: mc.code, team: "", status: "", sla: "", q: "" }); save(); return go("tickets"); }
    if (/^(tk|inc)-?\d+/i.test(q)) { const id = q.toUpperCase().replace(/^(TK|INC)-?/, "$1-"); if (getT(id)) return go("ticket-" + id); }
    const res = searchClients(q);
    if (res.length === 1) { state.ui.homeQ = ""; save(); return go("client-" + res[0].id); }
    state.ui.homeQ = q; save(); return go("accueil");
  }
  if (kind === "tq") { state.ui.tq.q = q; return commit(); }
  if (kind === "pick") { state.ui.pickQ = q; return commit(); }
  if (kind === "txq") { state.ui.txq = q; state.ui.txAll = true; return commit(); }
  if (kind === "mvq") { state.ui.mvq = q; return commit(); }
  if (kind === "txfq") { state.ui.txfq = q; return commit(); }
});

/* =========================================================
   DÉMARRAGE
   ========================================================= */
state = load();
if (!state) seed();
state.ui.modal = null; state.ui.blk = null; state.ui.bell = false; state.ui.menu = false; state.ui.pmenu = false; state.ui.confirmReset = false; state.ui.puk = null;
if (!("team" in state.ui.tq)) state.ui.tq.team = "";
if (["alerts", "closed"].includes(state.ui.tq.tab)) state.ui.tq.tab = "all";
tick(); save(); render();
setInterval(() => {
  const changed = tick();
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if (!typing && !state.ui.modal) render(); else if (changed) save();
}, 30000);
